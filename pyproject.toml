[project]
name = "bibcut"
version = "0.0.0"
description = "Find every rider in race footage by their start number and turn it into per-rider timelines, YouTube timestamps and highlight cuts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Petr Kratochvil" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.scripts]
bibcut = "bibcut.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
